name: Mirror repository updates to gitlab

on:
  push:
  create:
  delete:

concurrency:
  group: gitlab-mirror

jobs:
  mirror_to_gitlab:
    name: Gitlab Sync
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Push from refs/remotes/origin/*, not refs/heads/*: checkout creates only
      # the triggering branch locally, so --prune would delete every other branch
      # on GitLab. --prune also mirrors branch and tag deletions. origin/HEAD is
      # removed (without deref, which would delete origin/main) so it is not
      # pushed as a branch named HEAD.
      - name: Push all branches and tags
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git update-ref --no-deref -d refs/remotes/origin/HEAD
          git push --force --prune \
            "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_URL#https://}" \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
